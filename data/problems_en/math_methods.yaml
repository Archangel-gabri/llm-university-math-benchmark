  # =====================================================================
  # EASY (difficulty: 1) — problems 1-5
  # =====================================================================

  - id: MM-1
    text: |
      Given 5 observations:

      | x | 1   | 2   | 3   | 4   | 5   |
      |---|-----|-----|-----|-----|-----|
      | y | 2,1 | 3,8 | 5,2 | 6,9 | 8,1 |

      Construct the simple linear regression equation ŷ = a + bx by the least squares method.
      Compute the coefficients a and b.
    difficulty: 1
    type: computational
    topic: "Linear regression (least squares)"
    answer: |
      n = 5, Σx = 15, Σy = 26,1, Σxy = 93,4, Σx² = 55.
      b = (nΣxy − ΣxΣy)/(nΣx² − (Σx)²) = (467 − 391,5)/(275 − 225) = 75,5/50 = 1,51.
      a = (Σy − bΣx)/n = (26,1 − 1,51·15)/5 = 3,45/5 = 0,69.
      Answer: ŷ = 0,69 + 1,51x.
    source: "Composed for the experiment"

  - id: MM-2
    text: |
      Given 6 pairs of observations:

      | x  | 10 | 20 | 30 | 40 | 50 | 60 |
      |----|----|----|----|----|----|----|
      | y  | 15 | 25 | 22 | 35 | 40 | 50 |

      Compute the Pearson correlation coefficient r(x, y).
    difficulty: 1
    type: computational
    topic: "Pearson correlation"
    answer: |
      x̄ = 35, ȳ = 31,167.
      Σ(xᵢ − x̄)(yᵢ − ȳ) = 1165.
      √Σ(xᵢ − x̄)² = √1750 ≈ 41,833.
      √Σ(yᵢ − ȳ)² = √830,833 ≈ 28,824.
      r = 1165 / (41,833 · 28,824) ≈ 0,966.
      Answer: r ≈ 0,966.
    source: "Composed for the experiment"

  - id: MM-3
    text: |
      Given a table of 8 observations for a classification problem (target variable — "Purchase": Yes/No):

      | № | Temperature | Humidity  | Purchase |
      |---|-------------|-----------|----------|
      | 1 | Hot         | High      | No       |
      | 2 | Hot         | High      | No       |
      | 3 | Hot         | Low       | Yes      |
      | 4 | Cold        | High      | Yes      |
      | 5 | Cold        | Low       | Yes      |
      | 6 | Cold        | Low       | Yes      |
      | 7 | Cold        | High      | Yes      |
      | 8 | Hot         | Low       | No       |

      Using the Information Gain criterion, determine the best feature for the root node of the decision tree.
      Build a decision tree of depth at most 2.
    difficulty: 1
    type: computational
    topic: "Decision tree"
    answer: |
      Total: 5 Yes, 3 No. H(S) = −(5/8)log₂(5/8) − (3/8)log₂(3/8) ≈ 0,954.
      Temperature: Hot → (1 Yes, 3 No), Cold → (4 Yes, 0 No).
      H(Hot) ≈ 0,811, H(Cold) = 0.
      H(S|Temp) = 4/8 · 0,811 + 4/8 · 0 = 0,406. IG(Temp) ≈ 0,549.
      Humidity: High → (2 Yes, 2 No), Low → (3 Yes, 1 No).
      H(S|Humid) = 4/8 · 1,0 + 4/8 · 0,811 = 0,906. IG(Humid) ≈ 0,049.
      Best feature — Temperature (IG = 0,549 > 0,049).
      Tree: root — Temperature; branch "Cold" → leaf "Yes";
      branch "Hot" → subnode Humidity: "Low" → "Yes" (imprecise, 1 of 2), "High" → "No".
    source: "Composed for the experiment"

  - id: MM-4
    text: |
      Given 6 observations:

      | x | 1   | 2   | 3   | 4   | 5   | 6   |
      |---|-----|-----|-----|-----|-----|-----|
      | y | 2,5 | 3,1 | 4,8 | 5,0 | 7,2 | 7,9 |

      Construct the linear regression ŷ = a + bx and compute the coefficient of determination R².
    difficulty: 1
    type: computational
    topic: "Coefficient of determination R²"
    answer: |
      n = 6, Σx = 21, Σy = 30,5, Σxy = 124,3, Σx² = 91.
      b = (6·124,3 − 21·30,5)/(6·91 − 441) = (745,8 − 640,5)/(546 − 441) = 105,3/105 ≈ 1,003 (more precisely: 1,1286).
      Exact calculation: b = (nΣxy − ΣxΣy)/(nΣx² − (Σx)²) = (745,8 − 640,5)/105 ≈ 1,129.
      a = (30,5 − 1,129·21)/6 ≈ 1,133.
      ŷ = 1,133 + 1,129x.
      SS_tot = Σ(yᵢ − ȳ)² ≈ 23,108, SS_res = Σ(yᵢ − ŷᵢ)² ≈ 0,819.
      R² = 1 − SS_res/SS_tot = 1 − 0,819/23,108 ≈ 0,965.
      Answer: R² ≈ 0,965.
    source: "Composed for the experiment"

  - id: MM-5
    text: |
      The model produced the following predictions:

      | Observation | yᵢ (actual) | ŷᵢ (predicted) |
      |-------------|-------------|----------------|
      | 1           | 10          | 12             |
      | 2           | 15          | 14             |
      | 3           | 20          | 18             |
      | 4           | 25          | 27             |
      | 5           | 30          | 29             |

      Compute the MAE (mean absolute error) and MSE (mean squared error).
    difficulty: 1
    type: computational
    topic: "Model quality metrics (MAE, MSE)"
    answer: |
      Errors eᵢ = yᵢ − ŷᵢ: −2, 1, 2, −2, 1.
      |eᵢ|: 2, 1, 2, 2, 1.
      MAE = (2 + 1 + 2 + 2 + 1)/5 = 8/5 = 1,6.
      eᵢ²: 4, 1, 4, 4, 1.
      MSE = (4 + 1 + 4 + 4 + 1)/5 = 14/5 = 2,8.
      Answer: MAE = 1,6; MSE = 2,8.
    source: "Composed for the experiment"

