  # MEDIUM (difficulty: 2) — problems 6-10
  # =====================================================================

  - id: MM-6
    text: |
      Given 6 observations with two predictors:

      | № | x₁ | x₂ | y  |
      |---|----|----|-----|
      | 1 | 1  | 2  | 5   |
      | 2 | 2  | 1  | 6   |
      | 3 | 3  | 3  | 10  |
      | 4 | 4  | 2  | 11  |
      | 5 | 5  | 4  | 16  |
      | 6 | 6  | 3  | 15  |

      Construct the multiple linear regression ŷ = b₀ + b₁x₁ + b₂x₂ by the least squares method.
      Write the system of normal equations and find the coefficients b₀, b₁, b₂.
    difficulty: 2
    type: computational
    topic: "Multiple linear regression"
    answer: |
      Matrix X (with the column of ones):
      X'X = [[6, 21, 15], [21, 91, 59], [15, 59, 43]].
      X'y = [63, 261, 177].
      Solution of the system of normal equations (X'X)b = X'y:
      b₀ ≈ 0,667, b₁ ≈ 1,778, b₂ ≈ 1,444.
      Answer: ŷ ≈ 0,67 + 1,78x₁ + 1,44x₂.
    source: "Composed for the experiment"

  - id: MM-7
    text: |
      For the multiple regression model ŷ = b₀ + b₁x₁ + b₂x₂, built on n = 6 observations
      (from problem MM-6), it is known that:
      SS_reg = 100,167 (regression sum of squares),
      SS_res = 1,333 (residual sum of squares),
      SS_tot = 101,500 (total sum of squares).
      Standard errors of the coefficients: SE(b₀) ≈ 0,770, SE(b₁) ≈ 0,213, SE(b₂) ≈ 0,380.

      a) Compute the F-statistic and test the significance of the regression as a whole (α = 0,05, F_cr(2, 3) = 9,55).
      b) Compute the t-statistics for each coefficient and determine which of them are significant
         (α = 0,05, t_cr(3) = 3,182).
    difficulty: 2
    type: computational
    topic: "Testing regression significance (F-test, t-test)"
    answer: |
      a) F = (SS_reg/k) / (SS_res/(n−k−1)) = (100,167/2) / (1,333/3) = 50,083/0,444 ≈ 112,69.
      F = 112,69 > F_cr = 9,55 → the regression is significant.
      b) t(b₀) = 0,667/0,770 ≈ 0,87 — not significant (|0,87| < 3,182).
         t(b₁) = 1,778/0,213 ≈ 8,36 — significant (|8,36| > 3,182).
         t(b₂) = 1,444/0,380 ≈ 3,81 — significant (|3,81| > 3,182).
      Answer: the regression as a whole is significant; coefficients b₁ and b₂ are significant, b₀ is not.
    source: "Composed for the experiment"

  - id: MM-8
    text: |
      Consider a classification problem (target variable "Will buy": Yes/No).
      Given 8 observations:

      | № | Price  | Quality | Will buy |
      |---|--------|---------|----------|
      | 1 | Low    | Good    | Yes      |
      | 2 | Low    | Good    | Yes      |
      | 3 | Low    | Poor    | Yes      |
      | 4 | Low    | Poor    | Yes      |
      | 5 | High   | Good    | Yes      |
      | 6 | High   | Good    | No       |
      | 7 | High   | Poor    | No       |
      | 8 | High   | Poor    | No       |

      Compute the entropy of the target variable H(S), the conditional entropies H(S|Price) and H(S|Quality),
      as well as the Information Gain for each feature. Which feature is better for the first split?
    difficulty: 2
    type: computational
    topic: "Entropy and Information Gain"
    answer: |
      Total: 5 Yes, 3 No.
      H(S) = −(5/8)log₂(5/8) − (3/8)log₂(3/8) ≈ 0,954.
      Price=Low: 4 Yes, 0 No → H = 0.
      Price=High: 1 Yes, 3 No → H = −(1/4)log₂(1/4) − (3/4)log₂(3/4) ≈ 0,811.
      H(S|Price) = 4/8 · 0 + 4/8 · 0,811 ≈ 0,406.
      IG(Price) = 0,954 − 0,406 ≈ 0,549.
      Quality=Good: 3 Yes, 1 No → H ≈ 0,811.
      Quality=Poor: 2 Yes, 2 No → H = 1,000.
      H(S|Quality) = 4/8 · 0,811 + 4/8 · 1,000 ≈ 0,906.
      IG(Quality) = 0,954 − 0,906 ≈ 0,049.
      Answer: IG(Price) ≈ 0,549, IG(Quality) ≈ 0,049. Best feature — Price.
    source: "Composed for the experiment"

  - id: MM-9
    text: |
      Eight students received grades in two subjects:

      | Student     | 1  | 2  | 3  | 4  | 5  | 6  | 7  | 8  |
      |-------------|----|----|----|----|----|----|----|----|
      | Mathematics | 85 | 90 | 78 | 92 | 88 | 76 | 95 | 80 |
      | Physics     | 82 | 88 | 75 | 95 | 90 | 70 | 92 | 78 |

      Compute the Spearman rank correlation coefficient rₛ.
    difficulty: 2
    type: computational
    topic: "Spearman rank correlation"
    answer: |
      Ranks in mathematics Rₓ: 4, 6, 2, 7, 5, 1, 8, 3.
      Ranks in physics Rᵧ:     4, 5, 2, 8, 6, 1, 7, 3.
      dᵢ = Rₓᵢ − Rᵧᵢ:        0, 1, 0, −1, −1, 0, 1, 0.
      dᵢ²:                     0, 1, 0, 1, 1, 0, 1, 0.
      Σdᵢ² = 4, n = 8.
      rₛ = 1 − 6Σdᵢ²/(n(n²−1)) = 1 − 6·4/(8·63) = 1 − 24/504 ≈ 0,952.
      Answer: rₛ ≈ 0,952.
    source: "Composed for the experiment"

  - id: MM-10
    text: |
      From 5 observations a linear regression ŷ = 0,69 + 1,51x was built
      (data from problem MM-1: x = {1, 2, 3, 4, 5}, y = {2,1; 3,8; 5,2; 6,9; 8,1}).
      Standard error of the regression: s = √(Σeᵢ²/(n−2)) ≈ 0,149.

      a) Compute the point prediction ŷ at x₀ = 7.
      b) Construct the 95% prediction confidence interval (t₀,₀₂₅(3) = 3,182).
    difficulty: 2
    type: computational
    topic: "Prediction and confidence interval"
    answer: |
      a) ŷ₀ = 0,69 + 1,51·7 = 11,26.
      b) x̄ = 3, Σ(xᵢ − x̄)² = 10, s ≈ 0,149.
      SE_pred = s · √(1 + 1/n + (x₀−x̄)²/Σ(xᵢ−x̄)²) = 0,149 · √(1 + 0,2 + 16/10)
      = 0,149 · √2,8 ≈ 0,149 · 1,673 ≈ 0,250.
      Interval: ŷ₀ ± t · SE = 11,26 ± 3,182 · 0,250 = 11,26 ± 0,796.
      Answer: (10,46; 12,06).
    source: "Composed for the experiment"

  # =====================================================================
  # HARD (difficulty: 3) — problems 11-15
  # =====================================================================

  - id: MM-11
    text: |
      Given a logistic regression model: P(Y=1) = 1/(1 + exp(−z)),
      where z = b₀ + b₁x₁ + b₂x₂.
      Coefficient estimates: b₀ = −4,0, b₁ = 0,05, b₂ = 1,2.
      Here x₁ is the number of preparation hours, x₂ is the grade point average (GPA).

      For five students:

      | Student | x₁ (hours) | x₂ (GPA) |
      |---------|------------|----------|
      | A       | 40         | 3,0      |
      | B       | 60         | 2,5      |
      | C       | 80         | 3,5      |
      | D       | 20         | 2,0      |
      | E       | 50         | 3,2      |

      a) Compute the linear combination z for each student.
      b) Compute the probability P(Y=1) for each.
      c) At a threshold of 0,5 determine the predicted class for each student.
    difficulty: 3
    type: computational
    topic: "Logistic regression"
    answer: |
      Student A: z = −4 + 0,05·40 + 1,2·3,0 = −4 + 2 + 3,6 = 1,6. P = 1/(1+e^{−1,6}) ≈ 0,832. Class: 1.
      Student B: z = −4 + 0,05·60 + 1,2·2,5 = −4 + 3 + 3 = 2,0. P = 1/(1+e^{−2}) ≈ 0,881. Class: 1.
      Student C: z = −4 + 0,05·80 + 1,2·3,5 = −4 + 4 + 4,2 = 4,2. P = 1/(1+e^{−4,2}) ≈ 0,985. Class: 1.
      Student D: z = −4 + 0,05·20 + 1,2·2,0 = −4 + 1 + 2,4 = −0,6. P = 1/(1+e^{0,6}) ≈ 0,354. Class: 0.
      Student E: z = −4 + 0,05·50 + 1,2·3,2 = −4 + 2,5 + 3,84 = 2,34. P = 1/(1+e^{−2,34}) ≈ 0,912. Class: 1.
      Answer: A → 1, B → 1, C → 1, D → 0, E → 1.
    source: "Composed for the experiment"

  - id: MM-12
    text: |
      A 5-fold cross-validation of a linear regression model was carried out on 20 observations
      (4 observations in each fold). The following MSE values on the test folds were obtained:

      | Fold | MSE  |
      |------|------|
      | 1    | 2,1  |
      | 2    | 3,5  |
      | 3    | 1,8  |
      | 4    | 2,9  |
      | 5    | 2,2  |

      a) Compute the mean cross-validation error (CV-MSE).
      b) Compute the standard deviation of MSE across folds.
      c) Construct the 95% confidence interval for CV-MSE (t₀,₀₂₅(4) = 2,776).
      d) If an alternative model (decision tree) gave CV-MSE = 3,1 ± 0,8,
         which model should be preferred and why?
    difficulty: 3
    type: computational
    topic: "Cross-validation (k-fold)"
    answer: |
      a) CV-MSE = (2,1 + 3,5 + 1,8 + 2,9 + 2,2)/5 = 12,5/5 = 2,50.
      b) s² = Σ(MSEᵢ − CV-MSE)²/(k−1) = (0,16 + 1,00 + 0,49 + 0,16 + 0,09)/4 = 1,90/4 = 0,475.
         s = √0,475 ≈ 0,689.
      c) SE = s/√k = 0,689/√5 ≈ 0,308.
         CI: 2,50 ± 2,776 · 0,308 = 2,50 ± 0,86 → (1,64; 3,36).
      d) Linear regression: CV-MSE = 2,50 ± 0,69.
         Decision tree: CV-MSE = 3,10 ± 0,80.
         Linear regression is preferable: its mean error is lower (2,50 < 3,10),
         and its variance across folds is also smaller (0,69 < 0,80), which indicates a more stable model.
    source: "Composed for the experiment"

  - id: MM-13
    text: |
      On n = 30 observations two regression models were built:
      - Model 1 (linear: y = b₀ + b₁x): SS_res = 120, number of parameters k₁ = 3 (b₀, b₁, σ²).
      - Model 2 (quadratic: y = b₀ + b₁x + b₂x²): SS_res = 85, number of parameters k₂ = 4 (b₀, b₁, b₂, σ²).

      a) Compute the information criteria AIC and BIC for each model.
         Formulas: AIC = n·ln(SS_res/n) + 2k, BIC = n·ln(SS_res/n) + k·ln(n).
      b) Which model is better by each criterion?
      c) Explain why AIC and BIC may give different results.
    difficulty: 3
    type: computational
    topic: "Model comparison: AIC, BIC"
    answer: |
      n = 30, ln(30) ≈ 3,401.
      Model 1: AIC₁ = 30·ln(120/30) + 2·3 = 30·ln(4) + 6 = 30·1,386 + 6 = 41,589 + 6 = 47,589.
                BIC₁ = 30·ln(4) + 3·3,401 = 41,589 + 10,204 = 51,793.
      Model 2: AIC₂ = 30·ln(85/30) + 2·4 = 30·ln(2,833) + 8 = 30·1,041 + 8 = 31,244 + 8 = 39,244.
                BIC₂ = 30·ln(2,833) + 4·3,401 = 31,244 + 13,604 = 44,848.
      b) By AIC: Model 2 is better (39,24 < 47,59). By BIC: Model 2 is better (44,85 < 51,79).
      c) BIC penalizes complexity more strongly when n > 8 (penalty k·ln(n) > 2k).
         When SS_res values are close, BIC may prefer the simpler model, while AIC prefers the more complex one.
         In this case the gain from the reduction of SS_res is sufficient for both criteria.
    source: "Composed for the experiment"

  - id: MM-14
    text: |
      For a regression problem with two standardized predictors (x₁, x₂) it is known that:
      X'X = [[6, 2], [2, 6]], X'y = [16, 4].

      a) Find the OLS estimates of the coefficients β̂ = (X'X)⁻¹X'y.
      b) Find the Ridge estimates at λ = 2: β̂_Ridge = (X'X + λI)⁻¹X'y.
      c) Find the Ridge estimates at λ = 4.
      d) Explain what happens to the coefficients as λ increases.
      e) If Lasso (λ = 2) were used, how would the coefficients change qualitatively
         compared to Ridge?
    difficulty: 3
    type: computational
    topic: "Regularization: Ridge, Lasso"
    answer: |
      a) det(X'X) = 36 − 4 = 32.
         (X'X)⁻¹ = (1/32)·[[6,−2],[−2,6]].
         β̂ = (1/32)·[6·16 + (−2)·4, (−2)·16 + 6·4] = (1/32)·[88, −8] = [2,75; −0,25].
      b) X'X + 2I = [[8, 2], [2, 8]], det = 60.
         (X'X + 2I)⁻¹ = (1/60)·[[8,−2],[−2,8]].
         β̂_Ridge = (1/60)·[128 − 8, −32 + 32] = (1/60)·[120, 0] = [2,0; 0,0].
      c) X'X + 4I = [[10, 2], [2, 10]], det = 96.
         β̂_Ridge = (1/96)·[160 − 8, −32 + 40] = (1/96)·[152, 8] ≈ [1,583; 0,083].
      d) As λ increases, the coefficients shrink toward zero.
         Ridge never sets coefficients exactly to zero (the exception λ=2 in this case is a coincidence).
      e) Lasso at λ = 2: the small coefficient β₂ (= −0,25 under OLS) would be set exactly to zero
         (the L₁ penalty produces sparse solutions). β₁ would be shrunk but would remain nonzero.
         Approximate Lasso result: β̂ ≈ [2,17; 0] (Lasso zeroes out β₂).
    source: "Composed for the experiment"

  - id: MM-15
    text: |
      A binary classification model produced predicted probabilities for 10 objects:

      | Object | True class | P(Y=1) |
      |--------|------------|--------|
      | 1      | 1          | 0,9    |
      | 2      | 1          | 0,8    |
      | 3      | 0          | 0,7    |
      | 4      | 1          | 0,6    |
      | 5      | 0          | 0,55   |
      | 6      | 1          | 0,5    |
      | 7      | 0          | 0,4    |
      | 8      | 0          | 0,3    |
      | 9      | 1          | 0,2    |
      | 10     | 0          | 0,1    |

      a) Order the objects by decreasing P(Y=1) and successively compute TPR and FPR
         at each threshold, constructing the points of the ROC curve.
      b) Compute the AUC (area under the ROC curve) by the trapezoidal method.
      c) Interpret the obtained AUC value.
    difficulty: 3
    type: computational
    topic: "ROC curve and AUC"
    answer: |
      P = 5 (class 1), N = 5 (class 0). The objects are already ordered by decreasing P(Y=1).
      a) Points of the ROC curve (FPR, TPR):
         Start: (0; 0).
         After object 1 (class 1): TP=1, FP=0 → (0; 0,2).
         After object 2 (class 1): TP=2, FP=0 → (0; 0,4).
         After object 3 (class 0): TP=2, FP=1 → (0,2; 0,4).
         After object 4 (class 1): TP=3, FP=1 → (0,2; 0,6).
         After object 5 (class 0): TP=3, FP=2 → (0,4; 0,6).
         After object 6 (class 1): TP=4, FP=2 → (0,4; 0,8).
         After object 7 (class 0): TP=4, FP=3 → (0,6; 0,8).
         After object 8 (class 0): TP=4, FP=4 → (0,8; 0,8).
         After object 9 (class 1): TP=5, FP=4 → (0,8; 1,0).
         After object 10 (class 0): TP=5, FP=5 → (1,0; 1,0).
      b) AUC (trapezoidal method):
         AUC = 0·(0,2−0)/2 + 0·(0,4−0,2)/2 + 0,2·(0,4+0,4)/2 + 0·(0,6−0,4)/2
             + 0,2·(0,6+0,6)/2 + 0·(0,8−0,6)/2 + 0,2·(0,8+0,8)/2 + 0,2·(0,8+0,8)/2
             + 0·(1,0−0,8)/2 + 0,2·(1,0+1,0)/2
         AUC = 0 + 0 + 0,08 + 0 + 0,12 + 0 + 0,16 + 0,16 + 0 + 0,20 = 0,72.
         Check by the pairs method: 18 concordant out of 25 pairs → AUC = 18/25 = 0,72. ✓
      c) AUC = 0,72 — the model has satisfactory discriminating ability
         (a random classifier gives AUC = 0,5, an ideal one — AUC = 1,0).
    source: "Composed for the experiment"
