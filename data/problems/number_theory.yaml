section: "Теория чисел и комбинаторика"
section_id: NT
total: 15

problems:
  - id: NT-1
    text: "Докажите, что для любого натурального n число n³ − n делится на 6."
    difficulty: 1
    type: proof
    topic: "Делимость"
    answer: "n³−n = n(n−1)(n+1) — произведение трёх последовательных. Делится на 2 и на 3."
    source: "Виноградов"

  - id: NT-2
    text: "Найдите НОД(252, 198), используя алгоритм Евклида."
    difficulty: 1
    type: computational
    topic: "НОД, алгоритм Евклида"
    answer: "252=1·198+54; 198=3·54+36; 54=1·36+18; 36=2·18+0. НОД=18"
    source: "Бухштаб"

  - id: NT-3
    text: "Найдите остаток от деления 2¹⁰⁰ на 7."
    difficulty: 1
    type: computational
    topic: "Остатки, циклы степеней"
    answer: "2³≡1 (mod 7), цикл=3. 100=33·3+1. 2¹⁰⁰≡2 (mod 7). Ответ: 2"
    source: "Нестеренко"

  - id: NT-4
    text: "Сколькими способами можно выбрать 3 человека из группы в 10 человек?"
    difficulty: 1
    type: computational
    topic: "Комбинаторика, сочетания"
    answer: "C(10,3) = 120"
    source: "Стандартная задача"

  - id: NT-5
    text: "Докажите, что среди любых 13 натуральных чисел найдутся два, разность которых делится на 12."
    difficulty: 1
    type: proof
    topic: "Принцип Дирихле"
    answer: "12 возможных остатков, 13 чисел → по принципу Дирихле два совпадают."
    source: "Малый мехмат МГУ"

  - id: NT-6
    text: "Найдите остаток от деления 2²⁰⁰ на 13."
    difficulty: 2
    type: computational
    topic: "Малая теорема Ферма"
    answer: "2¹²≡1 (mod 13). 200=16·12+8. 2²⁰⁰≡2⁸=256≡9 (mod 13). Ответ: 9"
    source: "Виноградов"

  - id: NT-7
    text: "Вычислите значение функции Эйлера φ(360)."
    difficulty: 2
    type: computational
    topic: "Функция Эйлера"
    answer: "360=2³·3²·5. φ(360)=360·(1−½)·(1−⅓)·(1−⅕)=96"
    source: "Бухштаб"

  - id: NT-8
    text: "Сколько натуральных чисел от 1 до 1000 не делятся ни на 2, ни на 3, ни на 5?"
    difficulty: 2
    type: computational
    topic: "Включение-исключение"
    answer: "|A₂∪A₃∪A₅|=734. Ответ: 1000−734=266"
    source: "СУНЦ МГУ"

  - id: NT-9
    text: "Докажите, что среди любых n натуральных чисел найдутся несколько (возможно, одно), сумма которых делится на n."
    difficulty: 3
    type: proof
    topic: "Делимость, принцип Дирихле"
    answer: "Частичные суммы S₁,...,Sₙ. Если Sₖ≡0 — готово. Иначе среди n остатков из {1,...,n−1} по Дирихле Sᵢ≡Sⱼ, тогда aᵢ₊₁+...+aⱼ делится на n."
    source: "Малый мехмат МГУ, ВсОШ"

  - id: NT-10
    text: "На доске написаны числа 1, 2, 3, ..., 2025. За один ход разрешается стереть любые два числа a и b и написать вместо них число |a−b|. Можно ли добиться того, чтобы на доске осталось число 0?"
    difficulty: 3
    type: proof
    topic: "Инвариант (чётность)"
    answer: "Нет. Сумма 1+...+2025 = 2051325 (нечётная). Операция сохраняет чётность суммы (a+b ≡ |a−b| mod 2). Сумма останется нечётной, а 0 — чётное."
    source: "ВсОШ (вариация)"

  - id: NT-11
    text: "Докажите, что n⁵ − n делится на 30 для любого целого n."
    difficulty: 3
    type: proof
    topic: "Делимость, малая теорема Ферма"
    answer: "n⁵−n=n(n⁴−1)=n(n²−1)(n²+1). Делится на 2 (n(n−1)), на 3 (n(n−1)(n+1)), на 5 (малая Ферма: n⁵≡n mod 5). Итого на 30."
    source: "Виноградов"

  - id: NT-12
    text: "Назовём два числа почти равными, если они равны или отличаются друг от друга не более, чем на единицу. Верно ли, что из любого прямоугольника с натуральными сторонами можно вырезать какой-нибудь прямоугольник с натуральными сторонами, площадь которого почти равна половине площади исходного прямоугольника? Стороны вырезаемого прямоугольника не обязательно параллельны сторонам исходного прямоугольника."
    difficulty: 3
    type: proof
    topic: "Геометрия + теория чисел"
    answer: "Не всегда. Контрпример: 5×15, S=75, S/2=37.5. Нужен прямоугольник с S=37 или 38. Варианты: 1×37, 1×38, 2×19. Диагональ 5×15 = √250 < 16. Но длинная сторона каждого варианта ≥ 19 > √250. Не влезает."
    source: "Олимпиадный сборник (Е. Молчанов)"
    photo: "photos/photo_12-52-26.jpg"

  - id: NT-13
    text: "Можно ли расставить в вершинах куба натуральные числа так, чтобы в каждой паре чисел, связанных ребром, одно из них делилось на другое, а во всех других парах такого не было?"
    difficulty: 3
    type: proof
    topic: "Комбинаторика, делимость, конструкция"
    answer: "Да. Пример: 2, 30, 42, 3, 70, 7, 105, 5 (по вершинам куба)."
    photo: "photos/photo_12-59-57.jpg"

  - id: NT-14
    text: "На доску записали 99 чисел, среди которых нет равных. В тетрадку выписали 99·98/2 чисел — все разности двух чисел с доски (каждый раз из большего числа вычитали меньшее). Оказалось, что в тетрадке число 1 записано ровно 85 раз. Пусть d — наибольшее число, записанное в тетрадке. Найдите наименьшее возможное значение d."
    difficulty: 3
    type: computational
    topic: "Комбинаторика, оптимизация"
    answer: "d=111. «1» среди разностей = (число подряд идущих пар) = 99−(число блоков подряд идущих чисел). 85=99−k ⇒ k=14 блоков, 13 промежутков между ними ≥2. d=a₉₉−a₁=Σ(98 соседних разностей)=85·1+Σ(13 промежутков)≥85+13·2=111. Достижимо при всех промежутках =2."
    source: "Л. Самойлов"
    photo: "photos/photo_12-52-20.jpg"

  - id: NT-15
    text: "Дано натуральное число k. Вдоль дороги стоят n столбов через равные промежутки. Миша покрасил их в k цветов и для каждой пары одноцветных столбов, между которыми нет других столбов того же цвета, вычислил расстояние между ними. Все эти расстояния оказались различны. При каком наибольшем n так могло оказаться?"
    difficulty: 3
    type: computational
    topic: "Комбинаторика, оценка"
    answer: "n = 3k − 1"
    source: "М. Тихомиров, Ф. Петров; ВсОШ региональный этап"
    photo: "photos/photo_13-00-05.jpg"
