section: "Математическая статистика"
section_id: MS
total: 15

problems:
  - id: MS-1
    text: "Пусть X = (X₁, ..., Xₙ) — выборка из нормального распределения с параметрами a и σ². Вычислить среднее и дисперсию статистики X̄ (выборочное среднее). Какое распределение она имеет?"
    difficulty: 1
    type: computational
    topic: "Свойства оценок"
    answer: "EX̄ = a, DX̄ = σ²/n, X̄ ~ N(a, σ²/n)"
    source: "Семинар 1, задача 1"

  - id: MS-2
    text: "X = (X₁, ..., Xₙ) — выборка из распределения N(a, D). Найти оценки методом моментов для параметров a и D, когда оба параметра неизвестны."
    difficulty: 1
    type: computational
    topic: "Метод моментов"
    answer: "a* = X̄, D* = X̄² − (X̄)² = S²"
    source: "Семинар 2, задача 6"

  - id: MS-3
    text: "Пусть X = (X₁, ..., Xₙ) — выборка из нормального распределения N(a, D), D = σ² > 0. Найти МП-оценку обоих параметров."
    difficulty: 1
    type: computational
    topic: "Метод максимального правдоподобия"
    answer: "a* = X̄, D* = (1/n)Σ(Xᵢ − X̄)² = S²"
    source: "Семинар 3, задача 5"

  - id: MS-4
    text: "Пусть X = (X₁, ..., Xₙ) — выборка из нормального распределения N(a, σ²), где σ² считается известным параметром. Построить центральный доверительный интервал с уровнем доверия 1−α для параметра a с использованием статистики T(X) = (X̄ − a)/(σ/√n)."
    difficulty: 1
    type: computational
    topic: "Доверительные интервалы"
    answer: "(X̄ − z_{1−α/2}·σ/√n; X̄ + z_{1−α/2}·σ/√n)"
    source: "Семинар 5, задача 2"

  - id: MS-5
    text: "Бухгалтер компании решил предпринять выборочную проверку и выбрал 18 компонент, продававшихся в прошлом месяце. Стоимости отобранных компонент: 82, 30, 98, 116, 80, 150, 200, 88, 70, 90, 160, 100, 86, 76, 90, 140, 76, 68 денежных единиц. Найти оценку средней стоимости всех компонент и построить для неё доверительный интервал с надёжностью 0.95. Оценить, какой объём выборки необходим для достижения точности δ = 3."
    difficulty: 1
    type: applied
    topic: "Прикладная задача, ДИ"
    answer: "(80.11; 119.89), n = 792"
    source: "Семинар 6, задание 3"

  - id: MS-6
    text: "Пусть X = (X₁, ..., Xₙ) — выборка из распределения U[0, θ]. Исследовать на несмещённость и состоятельность оценку θ* = X₍ₙ₎ (максимум выборки). Найти смещение b(θ)."
    difficulty: 2
    type: computational
    topic: "Свойства оценок, порядковые статистики"
    answer: "Eθ* = nθ/(n+1), b(θ) = −θ/(n+1). Смещённая, но состоятельная."
    source: "Семинар 1, задача 4"

  - id: MS-7
    text: "X = (X₁, ..., Xₙ) — выборка из распределения Γ(α, λ). Найти оценки методом моментов для α и λ по первым двум моментам (оба параметра считаются неизвестными)."
    difficulty: 2
    type: computational
    topic: "Метод моментов, гамма-распределение"
    answer: "EX₁ = α/λ, EX₁² = α(α+1)/λ². Откуда: λ* = X̄/(X̄² − (X̄)²), α* = (X̄)²/(X̄² − (X̄)²)"
    source: "Семинар 2, задача 3"

  - id: MS-8
    text: "X = (X₁, ..., Xₙ) — выборка из распределения с плотностью f(y) = 3θy²e^{−θy³}, y > 0, θ > 0. Найти оценку максимального правдоподобия θ*. Исследовать на несмещённость оценку τ* = 1/θ* параметра τ = 1/θ."
    difficulty: 2
    type: computational
    topic: "МП, нестандартное распределение"
    answer: "θ* = n/Σ(Xᵢ³). τ* = Σ(Xᵢ³)/n = X̄³. Несмещённость: проверить Eτ* = 1/θ."
    source: "Семинар 3, задача 8"

  - id: MS-9
    text: "Пусть X = (X₁, ..., Xₙ) — выборка из распределения Бернулли B(θ), θ ∈ (0,1). Записать неравенство Рао-Крамера и проверить эффективность несмещённой оценки вероятности успеха θ* = X̄."
    difficulty: 2
    type: computational
    topic: "Неравенство Рао-Крамера, эффективность"
    answer: "I(θ) = 1/(θ(1−θ)). Нижняя граница: θ(1−θ)/n. DX̄ = θ(1−θ)/n. Оценка эффективна."
    source: "Семинар 4, задача 3"

  - id: MS-10
    text: "Пусть X = (X₁, ..., Xₙ) — выборка из распределения Пуассона с параметром λ. Построить асимптотически точный доверительный интервал для λ с уровнем доверия 1−α."
    difficulty: 2
    type: computational
    topic: "Асимптотические доверительные интервалы"
    answer: "По ЦПТ: T(X) = (X̄ − λ)/√(X̄/n) → N(0,1). ДИ: (X̄ − z·√(X̄/n); X̄ + z·√(X̄/n))"
    source: "Семинар 6, задача 2"

  - id: MS-11
    text: "Пусть X — выборка из некоторого распределения с конечной дисперсией θ = DX. Исследовать на несмещённость и состоятельность оценки θ₁* = S² и θ₂* = S₀². Найти смещения."
    difficulty: 3
    type: computational
    topic: "Смещение выборочной дисперсии"
    answer: "ES² = (n−1)θ/n, b₁ = −θ/n (смещённая). ES₀² = θ, b₂ = 0 (несмещённая). Обе состоятельные."
    source: "Семинар 1, задача 7"

  - id: MS-12
    text: "Пусть X = (X₁, ..., Xₙ) — выборка из трёхточечного распределения: P(X₁=1) = θ, P(X₁=2) = 2θ, P(X₁=3) = 1−3θ. Найти оценку максимального правдоподобия параметра θ."
    difficulty: 3
    type: computational
    topic: "МП, дискретное распределение"
    answer: "L(θ) = θ^{n₁}(2θ)^{n₂}(1−3θ)^{n₃}. dL/dθ = 0 → θ* = (n₁+n₂)/(3n)"
    source: "Семинар 3, задача 4"

  - id: MS-13
    text: "Пусть X = (X₁, ..., Xₙ) — выборка из показательного распределения E_α с параметром α > 0. Проверить оценку α* = (n−1)/(nX̄) (n > 2) на эффективность. Указание: сумма n независимых E_α имеет распределение Γ(α, n)."
    difficulty: 3
    type: computational
    topic: "Эффективность, гамма-распределение"
    answer: "Через распределение Γ(α,n): α*=(n−1)/S, S~Γ(α,n). E α*=α (несмещённая). D(α*)=α²/(n−2). Граница Рао-Крамера: α²/n. Поскольку α²/(n−2)>α²/n при n>2 — не эффективна при конечном n, но асимптотически эффективна."
    source: "Семинар 4, задача 8"

  - id: MS-14
    text: "Пусть X = (X₁, ..., Xₙ) — выборка из нормального распределения N(a, σ²). Построить центральный доверительный интервал с уровнем доверия 1−α для параметра a с использованием статистики T(X) = √n·(X̄ − a)/S₀, показав, что она имеет распределение t(n−1)."
    difficulty: 3
    type: computational
    topic: "t-распределение, точный ДИ"
    answer: "T ~ t(n−1). ДИ: (X̄ − t_{α/2,n−1}·S₀/√n; X̄ + t_{α/2,n−1}·S₀/√n)"
    source: "Семинар 5, задача 6"

  - id: MS-15
    text: "Пусть X = (X₁, ..., Xₙ) и Y = (Y₁, ..., Yₘ) — две независимые выборки из нормальных распределений N(a₁, σ²) и N(a₂, σ²) (с одинаковыми неизвестными дисперсиями). Доказать, что ((n−1)S₀²(X) + (m−1)S₀²(Y))/σ² ~ χ²(n+m−2). Придумать центральную статистику, зависящую от X̄ − Ȳ, и построить на её основе центральный доверительный интервал надёжности 1−α для параметра a₁ − a₂."
    difficulty: 3
    type: proof
    topic: "ДИ для разности средних"
    answer: "T = (X̄−Ȳ)/√(S²_pool·(1/n+1/m)) ~ t(n+m−2), где S²_pool = ((n−1)S₀²(X)+(m−1)S₀²(Y))/(n+m−2)"
    source: "Семинар 6, задача 6"
