  - id: MM-6
    text: |
      Дано 6 наблюдений с двумя предикторами:

      | № | x₁ | x₂ | y  |
      |---|----|----|-----|
      | 1 | 1  | 2  | 5   |
      | 2 | 2  | 1  | 6   |
      | 3 | 3  | 3  | 10  |
      | 4 | 4  | 2  | 11  |
      | 5 | 5  | 4  | 16  |
      | 6 | 6  | 3  | 15  |

      Построить множественную линейную регрессию ŷ = b₀ + b₁x₁ + b₂x₂ методом наименьших квадратов.
      Записать систему нормальных уравнений и найти коэффициенты b₀, b₁, b₂.
    difficulty: 2
    type: computational
    topic: "Множественная линейная регрессия"
    answer: |
      Матрица X (с единичным столбцом):
      X'X = [[6, 21, 15], [21, 91, 59], [15, 59, 43]].
      X'y = [63, 261, 177].
      Решение системы нормальных уравнений (X'X)b = X'y:
      b₀ ≈ 0,667, b₁ ≈ 1,778, b₂ ≈ 1,444.
      Ответ: ŷ ≈ 0,67 + 1,78x₁ + 1,44x₂.
    source: "Составлена для эксперимента"

  - id: MM-7
    text: |
      Для модели множественной регрессии ŷ = b₀ + b₁x₁ + b₂x₂, построенной по n = 6 наблюдениям
      (из задачи MM-6), известно:
      SS_reg = 100,167 (сумма квадратов регрессии),
      SS_res = 1,333 (сумма квадратов остатков),
      SS_tot = 101,500 (общая сумма квадратов).
      Стандартные ошибки коэффициентов: SE(b₀) ≈ 0,770, SE(b₁) ≈ 0,213, SE(b₂) ≈ 0,380.

      а) Вычислить F-статистику и проверить значимость регрессии в целом (α = 0,05, F_кр(2, 3) = 9,55).
      б) Вычислить t-статистики для каждого коэффициента и определить, какие из них значимы
         (α = 0,05, t_кр(3) = 3,182).
    difficulty: 2
    type: computational
    topic: "Проверка значимости регрессии (F-тест, t-тест)"
    answer: |
      а) F = (SS_reg/k) / (SS_res/(n−k−1)) = (100,167/2) / (1,333/3) = 50,083/0,444 ≈ 112,69.
      F = 112,69 > F_кр = 9,55 → регрессия значима.
      б) t(b₀) = 0,667/0,770 ≈ 0,87 — незначим (|0,87| < 3,182).
         t(b₁) = 1,778/0,213 ≈ 8,36 — значим (|8,36| > 3,182).
         t(b₂) = 1,444/0,380 ≈ 3,81 — значим (|3,81| > 3,182).
      Ответ: регрессия в целом значима; коэффициенты b₁ и b₂ значимы, b₀ — нет.
    source: "Составлена для эксперимента"

  - id: MM-8
    text: |
      Рассматривается задача классификации (целевая переменная «Купит»: Да/Нет).
      Дано 8 наблюдений:

      | № | Цена   | Качество | Купит |
      |---|--------|----------|-------|
      | 1 | Низкая | Хорошее  | Да    |
      | 2 | Низкая | Хорошее  | Да    |
      | 3 | Низкая | Плохое   | Да    |
      | 4 | Низкая | Плохое   | Да    |
      | 5 | Высокая| Хорошее  | Да    |
      | 6 | Высокая| Хорошее  | Нет   |
      | 7 | Высокая| Плохое   | Нет   |
      | 8 | Высокая| Плохое   | Нет   |

      Вычислить энтропию целевой переменной H(S), условные энтропии H(S|Цена) и H(S|Качество),
      а также Information Gain для каждого признака. Какой признак лучше для первого разбиения?
    difficulty: 2
    type: computational
    topic: "Энтропия и Information Gain"
    answer: |
      Всего: 5 Да, 3 Нет.
      H(S) = −(5/8)log₂(5/8) − (3/8)log₂(3/8) ≈ 0,954.
      Цена=Низкая: 4 Да, 0 Нет → H = 0.
      Цена=Высокая: 1 Да, 3 Нет → H = −(1/4)log₂(1/4) − (3/4)log₂(3/4) ≈ 0,811.
      H(S|Цена) = 4/8 · 0 + 4/8 · 0,811 ≈ 0,406.
      IG(Цена) = 0,954 − 0,406 ≈ 0,549.
      Качество=Хорошее: 3 Да, 1 Нет → H ≈ 0,811.
      Качество=Плохое: 2 Да, 2 Нет → H = 1,000.
      H(S|Качество) = 4/8 · 0,811 + 4/8 · 1,000 ≈ 0,906.
      IG(Качество) = 0,954 − 0,906 ≈ 0,049.
      Ответ: IG(Цена) ≈ 0,549, IG(Качество) ≈ 0,049. Лучший признак — Цена.
    source: "Составлена для эксперимента"

  - id: MM-9
    text: |
      Восемь студентов получили оценки по двум предметам:

      | Студент     | 1  | 2  | 3  | 4  | 5  | 6  | 7  | 8  |
      |-------------|----|----|----|----|----|----|----|----|
      | Математика  | 85 | 90 | 78 | 92 | 88 | 76 | 95 | 80 |
      | Физика      | 82 | 88 | 75 | 95 | 90 | 70 | 92 | 78 |

      Вычислить коэффициент ранговой корреляции Спирмена rₛ.
    difficulty: 2
    type: computational
    topic: "Ранговая корреляция Спирмена"
    answer: |
      Ранги по математике Rₓ: 4, 6, 2, 7, 5, 1, 8, 3.
      Ранги по физике Rᵧ:     4, 5, 2, 8, 6, 1, 7, 3.
      dᵢ = Rₓᵢ − Rᵧᵢ:        0, 1, 0, −1, −1, 0, 1, 0.
      dᵢ²:                     0, 1, 0, 1, 1, 0, 1, 0.
      Σdᵢ² = 4, n = 8.
      rₛ = 1 − 6Σdᵢ²/(n(n²−1)) = 1 − 6·4/(8·63) = 1 − 24/504 ≈ 0,952.
      Ответ: rₛ ≈ 0,952.
    source: "Составлена для эксперимента"

  - id: MM-10
    text: |
      По 5 наблюдениям построена линейная регрессия ŷ = 0,69 + 1,51x
      (данные из задачи MM-1: x = {1, 2, 3, 4, 5}, y = {2,1; 3,8; 5,2; 6,9; 8,1}).
      Стандартная ошибка регрессии: s = √(Σeᵢ²/(n−2)) ≈ 0,149.

      а) Вычислить точечный прогноз ŷ при x₀ = 7.
      б) Построить 95%-й доверительный интервал прогноза (t₀,₀₂₅(3) = 3,182).
    difficulty: 2
    type: computational
    topic: "Прогноз и доверительный интервал"
    answer: |
      а) ŷ₀ = 0,69 + 1,51·7 = 11,26.
      б) x̄ = 3, Σ(xᵢ − x̄)² = 10, s ≈ 0,149.
      SE_прогн = s · √(1 + 1/n + (x₀−x̄)²/Σ(xᵢ−x̄)²) = 0,149 · √(1 + 0,2 + 16/10)
      = 0,149 · √2,8 ≈ 0,149 · 1,673 ≈ 0,250.
      Интервал: ŷ₀ ± t · SE = 11,26 ± 3,182 · 0,250 = 11,26 ± 0,796.
      Ответ: (10,46; 12,06).
    source: "Составлена для эксперимента"

  # =====================================================================
  # HARD (difficulty: 3) — problems 11-15
  # =====================================================================

  - id: MM-11
    text: |
      Дана модель логистической регрессии: P(Y=1) = 1/(1 + exp(−z)),
      где z = b₀ + b₁x₁ + b₂x₂.
      Оценки коэффициентов: b₀ = −4,0, b₁ = 0,05, b₂ = 1,2.
      Здесь x₁ — количество часов подготовки, x₂ — средний балл (GPA).

      Для пяти студентов:

      | Студент | x₁ (часы) | x₂ (GPA) |
      |---------|-----------|-----------|
      | A       | 40        | 3,0       |
      | B       | 60        | 2,5       |
      | C       | 80        | 3,5       |
      | D       | 20        | 2,0       |
      | E       | 50        | 3,2       |

      а) Вычислить линейную комбинацию z для каждого студента.
      б) Вычислить вероятность P(Y=1) для каждого.
      в) При пороге 0,5 определить предсказанный класс для каждого студента.
    difficulty: 3
    type: computational
    topic: "Логистическая регрессия"
    answer: |
      Студент A: z = −4 + 0,05·40 + 1,2·3,0 = −4 + 2 + 3,6 = 1,6. P = 1/(1+e^{−1,6}) ≈ 0,832. Класс: 1.
      Студент B: z = −4 + 0,05·60 + 1,2·2,5 = −4 + 3 + 3 = 2,0. P = 1/(1+e^{−2}) ≈ 0,881. Класс: 1.
      Студент C: z = −4 + 0,05·80 + 1,2·3,5 = −4 + 4 + 4,2 = 4,2. P = 1/(1+e^{−4,2}) ≈ 0,985. Класс: 1.
      Студент D: z = −4 + 0,05·20 + 1,2·2,0 = −4 + 1 + 2,4 = −0,6. P = 1/(1+e^{0,6}) ≈ 0,354. Класс: 0.
      Студент E: z = −4 + 0,05·50 + 1,2·3,2 = −4 + 2,5 + 3,84 = 2,34. P = 1/(1+e^{−2,34}) ≈ 0,912. Класс: 1.
      Ответ: A → 1, B → 1, C → 1, D → 0, E → 1.
    source: "Составлена для эксперимента"

  - id: MM-12
    text: |
      Проведена 5-fold кросс-валидация модели линейной регрессии на 20 наблюдениях
      (4 наблюдения в каждом фолде). Получены следующие значения MSE на тестовых фолдах:

      | Фолд | MSE  |
      |------|------|
      | 1    | 2,1  |
      | 2    | 3,5  |
      | 3    | 1,8  |
      | 4    | 2,9  |
      | 5    | 2,2  |

      а) Вычислить среднюю ошибку кросс-валидации (CV-MSE).
      б) Вычислить стандартное отклонение MSE по фолдам.
      в) Построить 95%-й доверительный интервал для CV-MSE (t₀,₀₂₅(4) = 2,776).
      г) Если альтернативная модель (дерево решений) дала CV-MSE = 3,1 ± 0,8,
         какую модель следует предпочесть и почему?
    difficulty: 3
    type: computational
    topic: "Кросс-валидация (k-fold)"
    answer: |
      а) CV-MSE = (2,1 + 3,5 + 1,8 + 2,9 + 2,2)/5 = 12,5/5 = 2,50.
      б) s² = Σ(MSEᵢ − CV-MSE)²/(k−1) = (0,16 + 1,00 + 0,49 + 0,16 + 0,09)/4 = 1,90/4 = 0,475.
         s = √0,475 ≈ 0,689.
      в) SE = s/√k = 0,689/√5 ≈ 0,308.
         ДИ: 2,50 ± 2,776 · 0,308 = 2,50 ± 0,86 → (1,64; 3,36).
      г) Линейная регрессия: CV-MSE = 2,50 ± 0,69.
         Дерево решений: CV-MSE = 3,10 ± 0,80.
         Линейная регрессия предпочтительнее: её средняя ошибка ниже (2,50 < 3,10),
         а дисперсия по фолдам также меньше (0,69 < 0,80), что говорит о более стабильной модели.
    source: "Составлена для эксперимента"

  - id: MM-13
    text: |
      На n = 30 наблюдениях построены две модели регрессии:
      - Модель 1 (линейная: y = b₀ + b₁x): SS_res = 120, число параметров k₁ = 3 (b₀, b₁, σ²).
      - Модель 2 (квадратичная: y = b₀ + b₁x + b₂x²): SS_res = 85, число параметров k₂ = 4 (b₀, b₁, b₂, σ²).

      а) Вычислить информационные критерии AIC и BIC для каждой модели.
         Формулы: AIC = n·ln(SS_res/n) + 2k, BIC = n·ln(SS_res/n) + k·ln(n).
      б) Какая модель лучше по каждому критерию?
      в) Объяснить, почему AIC и BIC могут дать разные результаты.
    difficulty: 3
    type: computational
    topic: "Сравнение моделей: AIC, BIC"
    answer: |
      n = 30, ln(30) ≈ 3,401.
      Модель 1: AIC₁ = 30·ln(120/30) + 2·3 = 30·ln(4) + 6 = 30·1,386 + 6 = 41,589 + 6 = 47,589.
                BIC₁ = 30·ln(4) + 3·3,401 = 41,589 + 10,204 = 51,793.
      Модель 2: AIC₂ = 30·ln(85/30) + 2·4 = 30·ln(2,833) + 8 = 30·1,041 + 8 = 31,244 + 8 = 39,244.
                BIC₂ = 30·ln(2,833) + 4·3,401 = 31,244 + 13,604 = 44,848.
      б) По AIC: Модель 2 лучше (39,24 < 47,59). По BIC: Модель 2 лучше (44,85 < 51,79).
      в) BIC штрафует за сложность сильнее при n > 8 (штраф k·ln(n) > 2k).
         При близких SS_res BIC может предпочесть более простую модель, а AIC — более сложную.
         В данном случае выигрыш от снижения SS_res достаточен для обоих критериев.
    source: "Составлена для эксперимента"

  - id: MM-14
    text: |
      Для задачи регрессии с двумя стандартизованными предикторами (x₁, x₂) известно:
      X'X = [[6, 2], [2, 6]], X'y = [16, 4].

      а) Найти OLS-оценки коэффициентов β̂ = (X'X)⁻¹X'y.
      б) Найти Ridge-оценки при λ = 2: β̂_Ridge = (X'X + λI)⁻¹X'y.
      в) Найти Ridge-оценки при λ = 4.
      г) Объяснить, что происходит с коэффициентами при увеличении λ.
      д) Если бы использовался Lasso (λ = 2), как изменились бы коэффициенты качественно
         по сравнению с Ridge?
    difficulty: 3
    type: computational
    topic: "Регуляризация: Ridge, Lasso"
    answer: |
      а) det(X'X) = 36 − 4 = 32.
         (X'X)⁻¹ = (1/32)·[[6,−2],[−2,6]].
         β̂ = (1/32)·[6·16 + (−2)·4, (−2)·16 + 6·4] = (1/32)·[88, −8] = [2,75; −0,25].
      б) X'X + 2I = [[8, 2], [2, 8]], det = 60.
         (X'X + 2I)⁻¹ = (1/60)·[[8,−2],[−2,8]].
         β̂_Ridge = (1/60)·[128 − 8, −32 + 32] = (1/60)·[120, 0] = [2,0; 0,0].
      в) X'X + 4I = [[10, 2], [2, 10]], det = 96.
         β̂_Ridge = (1/96)·[160 − 8, −32 + 40] = (1/96)·[152, 8] ≈ [1,583; 0,083].
      г) При увеличении λ коэффициенты сжимаются к нулю.
         Ridge никогда не обнуляет коэффициенты точно (исключение λ=2 в данном случае — совпадение).
      д) Lasso при λ = 2: малый коэффициент β₂ (= −0,25 при OLS) был бы обнулён ровно
         (L₁-штраф порождает разреженные решения). β₁ был бы сжат, но остался бы ненулевым.
         Примерный результат Lasso: β̂ ≈ [2,17; 0] (Lasso зануляет β₂).
    source: "Составлена для эксперимента"

  - id: MM-15
    text: |
      Модель бинарной классификации выдала предсказанные вероятности для 10 объектов:

      | Объект | Истинный класс | P(Y=1) |
      |--------|----------------|--------|
      | 1      | 1              | 0,9    |
      | 2      | 1              | 0,8    |
      | 3      | 0              | 0,7    |
      | 4      | 1              | 0,6    |
      | 5      | 0              | 0,55   |
      | 6      | 1              | 0,5    |
      | 7      | 0              | 0,4    |
      | 8      | 0              | 0,3    |
      | 9      | 1              | 0,2    |
      | 10     | 0              | 0,1    |

      а) Упорядочить объекты по убыванию P(Y=1) и последовательно вычислить TPR и FPR
         при каждом пороге, построив точки ROC-кривой.
      б) Вычислить AUC (площадь под ROC-кривой) методом трапеций.
      в) Интерпретировать полученное значение AUC.
    difficulty: 3
    type: computational
    topic: "ROC-кривая и AUC"
    answer: |
      P = 5 (класс 1), N = 5 (класс 0). Объекты уже упорядочены по убыванию P(Y=1).
      а) Точки ROC-кривой (FPR, TPR):
         Начало: (0; 0).
         После объекта 1 (класс 1): TP=1, FP=0 → (0; 0,2).
         После объекта 2 (класс 1): TP=2, FP=0 → (0; 0,4).
         После объекта 3 (класс 0): TP=2, FP=1 → (0,2; 0,4).
         После объекта 4 (класс 1): TP=3, FP=1 → (0,2; 0,6).
         После объекта 5 (класс 0): TP=3, FP=2 → (0,4; 0,6).
         После объекта 6 (класс 1): TP=4, FP=2 → (0,4; 0,8).
         После объекта 7 (класс 0): TP=4, FP=3 → (0,6; 0,8).
         После объекта 8 (класс 0): TP=4, FP=4 → (0,8; 0,8).
         После объекта 9 (класс 1): TP=5, FP=4 → (0,8; 1,0).
         После объекта 10 (класс 0): TP=5, FP=5 → (1,0; 1,0).
      б) AUC (метод трапеций):
         AUC = 0·(0,2−0)/2 + 0·(0,4−0,2)/2 + 0,2·(0,4+0,4)/2 + 0·(0,6−0,4)/2
             + 0,2·(0,6+0,6)/2 + 0·(0,8−0,6)/2 + 0,2·(0,8+0,8)/2 + 0,2·(0,8+0,8)/2
             + 0·(1,0−0,8)/2 + 0,2·(1,0+1,0)/2
         AUC = 0 + 0 + 0,08 + 0 + 0,12 + 0 + 0,16 + 0,16 + 0 + 0,20 = 0,72.
         Проверка методом пар: 18 согласованных из 25 пар → AUC = 18/25 = 0,72. ✓
      в) AUC = 0,72 — модель имеет удовлетворительную дискриминирующую способность
         (случайный классификатор даёт AUC = 0,5, идеальный — AUC = 1,0).
    source: "Составлена для эксперимента"
