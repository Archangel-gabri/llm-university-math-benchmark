problems:
  # =====================================================================
  # EASY (difficulty: 1) — problems 1-5
  # =====================================================================

  - id: MM-1
    text: |
      Дано 5 наблюдений:

      | x | 1   | 2   | 3   | 4   | 5   |
      |---|-----|-----|-----|-----|-----|
      | y | 2,1 | 3,8 | 5,2 | 6,9 | 8,1 |

      Построить уравнение парной линейной регрессии ŷ = a + bx методом наименьших квадратов.
      Вычислить коэффициенты a и b.
    difficulty: 1
    type: computational
    topic: "Линейная регрессия (МНК)"
    answer: |
      n = 5, Σx = 15, Σy = 26,1, Σxy = 93,4, Σx² = 55.
      b = (nΣxy − ΣxΣy)/(nΣx² − (Σx)²) = (467 − 391,5)/(275 − 225) = 75,5/50 = 1,51.
      a = (Σy − bΣx)/n = (26,1 − 1,51·15)/5 = 3,45/5 = 0,69.
      Ответ: ŷ = 0,69 + 1,51x.
    source: "Составлена для эксперимента"

  - id: MM-2
    text: |
      Даны 6 пар наблюдений:

      | x  | 10 | 20 | 30 | 40 | 50 | 60 |
      |----|----|----|----|----|----|----|
      | y  | 15 | 25 | 22 | 35 | 40 | 50 |

      Вычислить коэффициент корреляции Пирсона r(x, y).
    difficulty: 1
    type: computational
    topic: "Корреляция Пирсона"
    answer: |
      x̄ = 35, ȳ = 31,167.
      Σ(xᵢ − x̄)(yᵢ − ȳ) = 1165.
      √Σ(xᵢ − x̄)² = √1750 ≈ 41,833.
      √Σ(yᵢ − ȳ)² = √830,833 ≈ 28,824.
      r = 1165 / (41,833 · 28,824) ≈ 0,966.
      Ответ: r ≈ 0,966.
    source: "Составлена для эксперимента"

  - id: MM-3
    text: |
      Дана таблица из 8 наблюдений для задачи классификации (целевая переменная — «Покупка»: Да/Нет):

      | № | Температура | Влажность | Покупка |
      |---|-------------|-----------|---------|
      | 1 | Жарко       | Высокая   | Нет     |
      | 2 | Жарко       | Высокая   | Нет     |
      | 3 | Жарко       | Низкая    | Да      |
      | 4 | Холодно     | Высокая   | Да      |
      | 5 | Холодно     | Низкая    | Да      |
      | 6 | Холодно     | Низкая    | Да      |
      | 7 | Холодно     | Высокая   | Да      |
      | 8 | Жарко       | Низкая    | Нет     |

      Используя критерий Information Gain, определить лучший признак для корневого узла дерева решений.
      Построить дерево решений глубины не более 2.
    difficulty: 1
    type: computational
    topic: "Дерево решений"
    answer: |
      Всего: 5 Да, 3 Нет. H(S) = −(5/8)log₂(5/8) − (3/8)log₂(3/8) ≈ 0,954.
      Температура: Жарко → (1 Да, 3 Нет), Холодно → (4 Да, 0 Нет).
      H(Жарко) ≈ 0,811, H(Холодно) = 0.
      H(S|Темп) = 4/8 · 0,811 + 4/8 · 0 = 0,406. IG(Темп) ≈ 0,549.
      Влажность: Высокая → (2 Да, 2 Нет), Низкая → (3 Да, 1 Нет).
      H(S|Влаж) = 4/8 · 1,0 + 4/8 · 0,811 = 0,906. IG(Влаж) ≈ 0,049.
      Лучший признак — Температура (IG = 0,549 > 0,049).
      Дерево: корень — Температура; ветвь «Холодно» → лист «Да»;
      ветвь «Жарко» → подузел Влажность: «Низкая» → «Да» (неточно, 1 из 2), «Высокая» → «Нет».
    source: "Составлена для эксперимента"

  - id: MM-4
    text: |
      Дано 6 наблюдений:

      | x | 1   | 2   | 3   | 4   | 5   | 6   |
      |---|-----|-----|-----|-----|-----|-----|
      | y | 2,5 | 3,1 | 4,8 | 5,0 | 7,2 | 7,9 |

      Построить линейную регрессию ŷ = a + bx и вычислить коэффициент детерминации R².
    difficulty: 1
    type: computational
    topic: "Коэффициент детерминации R²"
    answer: |
      n = 6, Σx = 21, Σy = 30,5, Σxy = 124,3, Σx² = 91.
      b = (6·124,3 − 21·30,5)/(6·91 − 441) = (745,8 − 640,5)/(546 − 441) = 105,3/105 ≈ 1,003 (точнее: 1,1286).
      Точный расчёт: b = (nΣxy − ΣxΣy)/(nΣx² − (Σx)²) = (745,8 − 640,5)/105 ≈ 1,129.
      a = (30,5 − 1,129·21)/6 ≈ 1,133.
      ŷ = 1,133 + 1,129x.
      SS_tot = Σ(yᵢ − ȳ)² ≈ 23,108, SS_res = Σ(yᵢ − ŷᵢ)² ≈ 0,819.
      R² = 1 − SS_res/SS_tot = 1 − 0,819/23,108 ≈ 0,965.
      Ответ: R² ≈ 0,965.
    source: "Составлена для эксперимента"

  - id: MM-5
    text: |
      Модель выдала следующие прогнозы:

      | Наблюдение | yᵢ (факт) | ŷᵢ (прогноз) |
      |------------|-----------|---------------|
      | 1          | 10        | 12            |
      | 2          | 15        | 14            |
      | 3          | 20        | 18            |
      | 4          | 25        | 27            |
      | 5          | 30        | 29            |

      Вычислить MAE (среднюю абсолютную ошибку) и MSE (среднеквадратическую ошибку).
    difficulty: 1
    type: computational
    topic: "Метрики качества модели (MAE, MSE)"
    answer: |
      Ошибки eᵢ = yᵢ − ŷᵢ: −2, 1, 2, −2, 1.
      |eᵢ|: 2, 1, 2, 2, 1.
      MAE = (2 + 1 + 2 + 2 + 1)/5 = 8/5 = 1,6.
      eᵢ²: 4, 1, 4, 4, 1.
      MSE = (4 + 1 + 4 + 4 + 1)/5 = 14/5 = 2,8.
      Ответ: MAE = 1,6; MSE = 2,8.
    source: "Составлена для эксперимента"

