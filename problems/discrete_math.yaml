section: "Дискретная математика и математическая логика"
section_id: DM
total: 15

problems:
  - id: DM-1
    text: "Дана формула логики высказываний: F(x,y,z) = (x→y) ∧ (¬y→z) → (x→z). а) Построить таблицу истинности. б) Является ли F тавтологией? в) Если нет, упростить формулу."
    difficulty: 1
    type: computational
    topic: "Логика высказываний"
    answer: "Не тавтология: F(1,1,0)=0. F = ¬x ∨ ¬y ∨ z"
    source: "Яблонский, гл.1"

  - id: DM-2
    text: "В группе 100 студентов: 70 изучают матанализ, 65 — алгебру, 50 — геометрию. Матанализ и алгебру — 40, матанализ и геометрию — 30, алгебру и геометрию — 25, все три — 10. Сколько студентов изучают хотя бы один предмет?"
    difficulty: 1
    type: computational
    topic: "Множества, формула включений-исключений"
    answer: "|A∪B∪C| = 70+65+50−40−30−25+10 = 100"
    source: "Стандартная задача"

  - id: DM-3
    text: "Дан граф G с вершинами {1,2,3,4,5,6} и рёбрами {(1,2),(1,3),(2,3),(2,4),(3,5),(4,5),(4,6),(5,6)}. а) Найти степени всех вершин. б) Проверить лемму о рукопожатиях. в) Является ли граф связным? г) Существует ли эйлеров путь?"
    difficulty: 1
    type: computational
    topic: "Графы (базовые)"
    answer: "Степени: d(1)=2, d(2)=3, d(3)=3, d(4)=3, d(5)=3, d(6)=2. Σd=16=2·8. Связный. 4 вершины нечётной степени → нет эйлерова пути."
    source: "Новиков"

  - id: DM-4
    text: "а) Сколько способов выбрать 3 предмета из 10? б) Сколько способов рассадить 5 человек за круглый стол? в) Сколько различных анаграмм можно составить из букв слова МАТЕМАТИКА?"
    difficulty: 1
    type: computational
    topic: "Комбинаторика"
    answer: "а) C(10,3)=120. б) (5−1)!=24. в) 10!/(3!·2!·1!·1!·1!·1!·1!) = 151200 (М×3, А×2, Т,Е,И,К по 1)"
    source: "Стандартные задачи"

  - id: DM-5
    text: "Построить СДНФ и СКНФ для булевой функции f(x,y,z) = x ⊕ (y ∧ z)."
    difficulty: 1
    type: computational
    topic: "Булева алгебра, нормальные формы"
    answer: "f=1 при (0,0,0),(0,0,1),(0,1,0),(1,1,1). СДНФ: ¬x¬y¬z ∨ ¬x¬yz ∨ ¬xy¬z ∨ xyz. СКНФ: (x∨y∨¬z)(x∨¬y∨¬z)(¬x∨y∨z)(¬x∨¬y∨z)"
    source: "Яблонский"

  - id: DM-6
    text: "Записать отрицание формулы: ∀ε>0 ∃δ>0: ∀x (|x−a|<δ → |f(x)−L|<ε). Дать словесную интерпретацию исходного утверждения и его отрицания."
    difficulty: 2
    type: computational
    topic: "Предикатная логика"
    answer: "Отрицание: ∃ε>0 ∀δ>0 ∃x: |x−a|<δ ∧ |f(x)−L|≥ε. Исходное: определение предела. Отрицание: предел не равен L."
    source: "Стандартная задача"

  - id: DM-7
    text: "Дан ориентированный взвешенный граф с 6 вершинами (A-F). Рёбра: A→B(2), A→C(5), B→C(1), B→D(4), C→D(2), C→E(3), D→E(1), D→F(7), E→F(3). Найти кратчайшие расстояния от A до всех вершин алгоритмом Дейкстры. Показать пошаговое выполнение."
    difficulty: 2
    type: computational
    topic: "Алгоритм Дейкстры"
    answer: "d(A)=0, d(B)=2, d(C)=3, d(D)=5, d(E)=6, d(F)=9"
    source: "Новиков"

  - id: DM-8
    text: "Решить рекуррентное соотношение: aₙ = 3aₙ₋₁ − 2aₙ₋₂, a₀ = 1, a₁ = 3. Найти a₅."
    difficulty: 2
    type: computational
    topic: "Рекуррентные соотношения"
    answer: "Характеристическое: k²−3k+2=0, k₁=1, k₂=2. aₙ=C₁+C₂·2ⁿ. a₀=1: C₁+C₂=1. a₁=3: C₁+2C₂=3. C₁=−1, C₂=2. aₙ=2ⁿ⁺¹−1. a₅=63."
    source: "Гаврилов-Сапоженко"

  - id: DM-9
    text: "На множестве целых чисел ℤ задано отношение: xRy ⟺ 5 | (x−y). а) Является ли R отношением эквивалентности? б) Если да, описать классы эквивалентности."
    difficulty: 2
    type: computational
    topic: "Отношения эквивалентности"
    answer: "Да (рефлексивно, симметрично, транзитивно). 5 классов: [0]={...,-10,-5,0,5,10,...}, [1], [2], [3], [4]."
    source: "Стандартная задача"

  - id: DM-10
    text: "Доказать методом математической индукции: 1² + 2² + ... + n² = n(n+1)(2n+1)/6."
    difficulty: 2
    type: proof
    topic: "Математическая индукция"
    answer: "База n=1: 1=1·2·3/6=1 ✓. Шаг: предполагаем для n, проверяем для n+1: n(n+1)(2n+1)/6 + (n+1)² = (n+1)(n+2)(2n+3)/6."
    source: "Стандартная задача"

  - id: DM-11
    text: "Граф Петерсена — 3-регулярный граф на 10 вершинах. а) Существует ли в нём эйлеров цикл? б) Существует ли гамильтонов цикл? в) Найти хроматическое число."
    difficulty: 3
    type: computational
    topic: "Граф Петерсена"
    answer: "а) Нет (все вершины нечётной степени 3). б) Нет (классический результат). в) χ=3."
    source: "Классика теории графов"

  - id: DM-12
    text: "Найти производящую функцию и формулу общего члена для последовательности, заданной рекуррентно: aₙ = 4aₙ₋₁ − 4aₙ₋₂, a₀ = 0, a₁ = 2. Найти a₁₀."
    difficulty: 3
    type: computational
    topic: "Производящие функции"
    answer: "A(x)=2x/(1−2x)²=Σ n·2ⁿ·xⁿ. aₙ=n·2ⁿ (n≥0). a₁₀=10·2¹⁰=10240."
    source: "Гаврилов-Сапоженко"

  - id: DM-13
    text: "Определить, являются ли полными следующие системы булевых функций (использовать теорему Поста): а) {∧, ⊕, 1}; б) {∨, →}; в) {¬, ∧, 0}; г) {↔, ∨}."
    difficulty: 3
    type: computational
    topic: "Полнота, теорема Поста"
    answer: "а) Полная (не в T₀: 1; не в T₁: ⊕(1,1)=0; не в S: ∧; не в M: ⊕; не в L: ∧). б) Не полная (⊂T₁). в) Полная. г) Не полная (⊂T₀: ↔(0,0)=1? Нет. Проверка: {↔,∨}⊂S — нет. Подробно: ∨∈T₀∩T₁∩M, ↔∈T₀? ↔(0,0)=1, значит ↔∉T₀. Но {↔,∨} ⊂ класс линейных? Нет. Фактически не полная: ⊂T₁)."
    source: "Яблонский"

  - id: DM-14
    text: "Код Хэмминга (7,4). Получено слово 1010110. а) Вычислить синдром. б) Определить позицию ошибки (если есть). в) Восстановить исходное кодовое слово. г) Какое минимальное расстояние кода?"
    difficulty: 3
    type: computational
    topic: "Теория кодирования, код Хэмминга"
    answer: "Синдром s=(s₁,s₂,s₃)=(1,1,0)₂=6. Ошибка в бите 6. Исправленное: 1010100. dₘᵢₙ=3."
    source: "Стандартная задача"

  - id: DM-15
    text: "Рассмотреть множество делителей числа 30 с отношением делимости (D₃₀, |). а) Построить диаграмму Хассе. б) Найти все максимальные цепи. в) Найти максимальную антицепь. г) Является ли (D₃₀, |) решёткой? д) Изоморфна ли она булеану 2^{2,3,5}?"
    difficulty: 3
    type: computational
    topic: "Частичные порядки, решётки"
    answer: "D₃₀={1,2,3,5,6,10,15,30}. 6 максимальных цепей длины 4 (например 1→2→6→30). Макс. антицепь: {6,10,15} (размер 3). Да, решётка. Изоморфна 2^{2,3,5} (каждый делитель ↔ подмножество простых)."
    source: "Гаврилов-Сапоженко"
